<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bước 3: Đặt Lại Mật Khẩu - NPKL</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <a href="../TrangChinh/index.html" class="logo">
                <span>NP</span>KL
            </a>
            <p class="brand-subtitle">Sàn Thương Mại Điện Tử Hàng Đầu</p>
        </div>

        <!-- Step Indicator -->
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 20px;">
            <span style="background: #E2E8F0; color: #64748B; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">1</span>
            <span style="background: #E2E8F0; color: #64748B; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">2</span>
            <span style="background: var(--brand-orange); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">3</span>
        </div>

        <h1 class="page-title">Đặt Mật Khẩu Mới</h1>
        <p style="font-size: 0.88rem; color: var(--text-muted); text-align: center; margin-top: -12px; margin-bottom: 20px;">
            Vui lòng nhập mật khẩu mới để hoàn tất khôi phục tài khoản
        </p>

        <!-- Form Bước 3: Đặt Mật Khẩu Mới -->
        <form id="resetForm">
            <!-- Mật Khẩu Mới -->
            <div class="form-group">
                <label for="newPassword" class="form-label">Mật khẩu mới <span style="color: #DC2626;">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="newPassword" class="form-input" placeholder="Tối thiểu 8 ký tự" minlength="8" required />
                    <button type="button" id="toggleNewPassword" class="toggle-password" title="Hiện/Ẩn mật khẩu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Xác Nhận Mật Khẩu Mới -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới <span style="color: #DC2626;">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </span>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu mới" minlength="8" required />
                    <button type="button" id="toggleConfirmPassword" class="toggle-password" title="Hiện/Ẩn mật khẩu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnSubmitReset" class="btn-submit">
                Hoàn Tất Đổi Mật Khẩu 🔒
            </button>
        </form>

        <!-- Card Footer -->
        <div class="card-footer">
            <a href="index.html" class="back-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Quay lại Đăng Nhập
            </a>
        </div>
    </div>

    <!-- POPUP ALERT MODAL -->
    <div id="alertPopupModal" class="alert-popup-overlay" style="display: none;">
        <div class="alert-popup-card">
            <div class="alert-popup-icon" id="popupIcon">🎉</div>
            <h3 class="alert-popup-title" id="popupTitle">Thông Báo</h3>
            <p class="alert-popup-message" id="popupMessage">Nội dung thông báo sẽ hiển thị ở đây...</p>
            <button type="button" class="alert-popup-btn" id="btnPopupConfirm">Đồng Ý</button>
        </div>
    </div>

    <script src="dat-lai-mat-khau.js"></script>
</body>
</html>
