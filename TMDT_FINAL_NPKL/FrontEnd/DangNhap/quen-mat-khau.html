<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bước 1: Quên Mật Khẩu - NPKL</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <a href="../TrangChinh/index.html" class="logo">
                <span>NP</span>KL
            </a>
            <p class="brand-subtitle">Sàn Thương Mại Điện Tử Hàng Đầu</p>
        </div>

        <!-- Step Indicator -->
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 20px;">
            <span style="background: var(--brand-orange); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">1</span>
            <span style="background: #E2E8F0; color: #64748B; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">2</span>
            <span style="background: #E2E8F0; color: #64748B; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">3</span>
        </div>

        <h1 class="page-title">Quên Mật Khẩu</h1>
        <p style="font-size: 0.88rem; color: var(--text-muted); text-align: center; margin-top: -12px; margin-bottom: 24px;">
            Nhập email tài khoản của bạn để nhận mã OTP xác thực
        </p>

        <!-- Form Bước 1: Nhập Email -->
        <form id="step1EmailForm">
            <div class="form-group">
                <label for="email" class="form-label">Email Đăng Ký Tài Khoản <span style="color: #DC2626;">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="email" class="form-input" placeholder="nhapemail@gmail.com" required autocomplete="email" />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnSendOtp" class="btn-submit">
                Gửi Mã OTP Xác Thực 📩
            </button>
        </form>

        <!-- Card Footer -->
        <div class="card-footer">
            <a href="index.html" class="back-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Quay lại Đăng Nhập
            </a>
        </div>
    </div>

    <!-- POPUP ALERT MODAL (THÔNG BÁO POPUP ĐỌC THOẢI MÁI) -->
    <div id="alertPopupModal" class="alert-popup-overlay" style="display: none;">
        <div class="alert-popup-card">
            <div class="alert-popup-icon" id="popupIcon">📩</div>
            <h3 class="alert-popup-title" id="popupTitle">Thông Báo</h3>
            <p class="alert-popup-message" id="popupMessage">Nội dung thông báo sẽ hiển thị ở đây...</p>
            <button type="button" class="alert-popup-btn" id="btnPopupConfirm">Đồng Ý</button>
        </div>
    </div>

    <script src="quen-mat-khau.js"></script>
</body>
</html>
