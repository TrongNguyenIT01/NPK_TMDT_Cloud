<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - NPKL Sàn Thương Mại Điện Tử Hàng Đầu</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="register-card">
        <!-- Logo & Header -->
        <div class="brand-header">
            <a href="../TrangChinh/index.html" class="logo">NP<span>KL</span></a>
            <p class="brand-subtitle">Sàn Thương Mại Điện Tử Hàng Đầu</p>
        </div>

        <h2 class="page-title">Đăng Ký Tài Khoản</h2>

        <!-- Register Form -->
        <form id="registerForm">
            <!-- Role Selector Combobox -->
            <div class="form-group full-width">
                <label class="form-label" for="roleSelect">Loại tài khoản đăng ký</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <select id="roleSelect" class="form-input form-select" required>
                        <option value="CUSTOMER">👤 Khách Hàng (Mua sắm sản phẩm)</option>
                        <option value="SELLER">🏪 Người Bán (Đăng ký tài khoản bán hàng)</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <!-- Full Name -->
                <div class="form-group full-width">
                    <label class="form-label" for="fullName">Họ và tên</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="fullName" class="form-input" placeholder="Nhập đầy đủ họ và tên" required />
                    </div>
                </div>

                <!-- Username -->
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                            </svg>
                        </span>
                        <input type="text" id="username" class="form-input" placeholder="Tên tài khoản" required />
                    </div>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </span>
                        <input type="tel" id="phone" class="form-input" placeholder="090x xxx xxx" />
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group full-width">
                    <label class="form-label" for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" id="email" class="form-input" placeholder="example@email.com" required />
                    </div>
                </div>
                
                <!-- Địa Chỉ -->
                <div class="form-group full-width">
                    <label class="form-label" for="email">Địa chỉ </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="text" id="Address" class="form-input" placeholder="1310 ấp 2 xã Cái Bè - Tỉnh Đồng Tháp" required />
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" class="form-input" placeholder="Tối thiểu 8 ký tự" required />
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </span>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required />
                    </div>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms-wrapper">
                <input type="checkbox" id="terms" required />
                <label for="terms">Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> & <a href="#">Chính sách bảo mật</a></label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">ĐĂNG KÝ TÀI KHOẢN</button>
        </form>

        <!-- Footer Links -->
        <div class="card-footer">
            <p>Đã có tài khoản? <a href="../DangNhap/index.html">Đăng nhập ngay</a></p>
            <a href="../TrangChinh/index.html" class="back-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Quay lại trang chủ
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
